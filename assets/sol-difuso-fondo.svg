<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 20 580 620"><defs>
    <pattern id="puntos-sol" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="3" cy="3" r="2.8" fill="#d9a749"/><circle cx="8.5" cy="8.5" r="2.8" fill="#d9a749"/></pattern>
    <pattern id="puntos" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="3" cy="3" r="2.6" fill="#79a8cd"/><circle cx="8.5" cy="8.5" r="2.6" fill="#79a8cd"/>
    </pattern>
    <filter id="difuso" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .36  0 0 0 -1.6 1.05"/>
    </filter>
    <!-- la bandera: franjas onduladas y difuminadas que atraviesan a la pareja -->
    <mask id="m-celeste"><rect width="1000" height="1000" fill="#000"/>
      <g filter="url(#difuso)" fill="#fff">
        <path d="M-80 -60H1080V250C820 300 560 210 300 270 140 305 40 300 -80 280Z"/>
        <path d="M-80 1060H1080V760C820 700 560 800 300 735 140 700 40 710 -80 730Z"/>
      </g></mask>
    <mask id="m-sol"><rect width="1000" height="1000" fill="#000"/>
      <circle cx="250" cy="330" r="185" fill="#fff" filter="url(#difuso)"/></mask>
  </defs><rect x="-40" y="20" width="580" height="620" fill="#d9a749" opacity=".48" mask="url(#m-sol)"/><rect x="-40" y="20" width="580" height="620" fill="url(#puntos-sol)" opacity=".28" mask="url(#m-sol)"/></svg>